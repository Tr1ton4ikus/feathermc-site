name: Diagnose FeatherMC domain
on:
  push:
    paths:
      - '.github/workflows/dns-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages DNS and HTTPS
        shell: bash
        run: |
          echo '--- Nameservers ---'
          dig +time=3 +tries=1 +short NS mcfeather.com || true
          echo '--- A records Google ---'
          dig @8.8.8.8 +time=3 +tries=1 +short A mcfeather.com || true
          echo '--- A records Cloudflare ---'
          dig @1.1.1.1 +time=3 +tries=1 +short A mcfeather.com || true
          echo '--- AAAA records ---'
          dig @1.1.1.1 +time=3 +tries=1 +short AAAA mcfeather.com || true
          echo '--- WWW CNAME ---'
          dig @1.1.1.1 +time=3 +tries=1 +short CNAME www.mcfeather.com || true
          echo '--- CAA records ---'
          dig @1.1.1.1 +time=3 +tries=1 +short CAA mcfeather.com || true
          echo '--- HTTP apex status, final URL ---'
          curl -L -o /dev/null -w 'http_code=%{http_code} final_url=%{url_effective} remote_ip=%{remote_ip}\n' --max-time 12 -sS http://mcfeather.com/ || true
          echo '--- HTTPS apex status and verification ---'
          curl -L -o /dev/null -w 'http_code=%{http_code} ssl_verify=%{ssl_verify_result} final_url=%{url_effective}\n' --max-time 12 -sS https://mcfeather.com/ || true
          echo '--- HTTPS www status and verification ---'
          curl -L -o /dev/null -w 'http_code=%{http_code} ssl_verify=%{ssl_verify_result} final_url=%{url_effective}\n' --max-time 12 -sS https://www.mcfeather.com/ || true
          echo '--- Certificate Subject, SAN and dates ---'
          echo | openssl s_client -servername mcfeather.com -connect mcfeather.com:443 2>/dev/null | openssl x509 -noout -subject -dates -ext subjectAltName || true
          echo '--- HTTP apex page title ---'
          curl --max-time 12 -sS http://mcfeather.com/ | grep -o -m 1 '<title>[^<]*</title>' || true
          echo '--- Pages domain redirect ---'
          curl -I --max-time 12 -sS https://tr1ton4ikus.github.io/feathermc-site/ | head -n 12 || true
