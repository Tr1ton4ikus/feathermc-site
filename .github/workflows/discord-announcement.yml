name: Send Feather Discord announcement

on:
  workflow_dispatch:
    inputs:
      announcement:
        description: "Choose which Discord post to send"
        required: true
        type: choice
        default: how-to-play
        options:
          - how-to-play
          - opening

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish selected Discord announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FEATHER_ANNOUNCEMENT: ${{ inputs.announcement }}
        run: python3 tools/send-discord-announcement.py --announcement "$FEATHER_ANNOUNCEMENT"
